apiVersion: v1
kind: Pod
metadata:
  name: config-demo
spec:
 containers:
   - name: nginx
     image: nginx
     env:
       - name: APP_ENV
         valueFrom:
          configMapKeyRef:
           name: app-config
           key: APP_ENV

       - name: LOG_LEVEL
         valueFrom:
           configMapKeyRef:
             name: app-config
             key: LOG_LEVEL

       - name: APP_VERSION
         valueFrom:
           configMapKeyRef:
            name: app-config
            key: APP_VERSION      
   

