apiVersion: apps/v1
kind: ReplicaSet
metadata: 
 name: frontend-rs
spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend
  template: 
    metadata:
     labels:
      app: backend


    spec:
     containers:
      - name: nginx
        image: nginx
        ports:
         - containerPort: 80  
